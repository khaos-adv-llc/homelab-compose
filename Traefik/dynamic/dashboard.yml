http:
  routers:
    # Replaced by traefik-log-dashboard below (2026-09-18) -- kept here,
    # disabled, in case the stock Traefik dashboard is ever needed again.
    # traefik-dashboard:
    #   rule: >-
    #     Host(`traefik.valdeze.ch`) &&
    #     (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    #   entryPoints:
    #     - websecure
    #   service: api@internal
    #   middlewares:
    #     - dashboard-lan-allowlist
    #     - authentik-forward-auth
    #     - dashboard-rate-limit
    #     - security-headers
    #   tls: {}

    traefik-log-dashboard:
      rule: "Host(`traefik.valdeze.ch`)"
      entryPoints:
        - websecure
      service: traefik-log-dashboard-service
      middlewares:
        - dashboard-lan-allowlist
        - authentik-forward-auth
        - dashboard-rate-limit
        - security-headers
      tls: {}

    authentik-outpost:
      rule: >-
        Host(`traefik.valdeze.ch`) &&
        PathPrefix(`/outpost.goauthentik.io/`)
      entryPoints:
        - websecure
      service: authentik-outpost-service
      tls: {}

  services:
    traefik-log-dashboard-service:
      loadBalancer:
        servers:
          - url: "http://traefik-log-dashboard:3000"

    authentik-outpost-service:
      loadBalancer:
        servers:
          - url: "http://authentik-outpost:9000"

  middlewares:
    dashboard-lan-allowlist:
      ipAllowList:
        sourceRange:
          - "10.210.40.0/24"
          - "10.210.50.0/24"
          - "192.168.3.3/32"  # Tucker's laptop WireGuard peer IP

    authentik-forward-auth:
      forwardAuth:
        address: "http://authentik-outpost:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: false
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt

    dashboard-rate-limit:
      rateLimit:
        average: 10
        period: 1s
        burst: 20

    security-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: false
