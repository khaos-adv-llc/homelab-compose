# gitleaks config for this repo.
# Run `gitleaks protect --staged -v` as a pre-commit hook (see README) so a
# real secret can never land in a commit, even by accident.

title = "homelab-compose gitleaks config"

[extend]
useDefault = true

[allowlist]
  paths = [
    '''\.env\.example$''',
    '''README\.md$''',
  ]
