services:
    postgres:
        image: postgres:latest
        restart: unless-stopped
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        volumes:
            - /docker/ReactiveResume/postgresql:/var/lib/postgresql
        networks:
            - reactive_resume_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:alpine
        restart: unless-stopped
        networks:
            - reactive_resume_network
        volumes:
            - /docker/ReactiveResume/redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    reactive_resume:
        image: amruthpillai/reactive-resume:latest
        restart: unless-stopped
        environment:
            - APP_URL=https://resume.${DOMAIN}
            - NEXTAUTH_URL_INTERNAL=http://127.0.0.1:3000 # <-- Add this line to stop WAN loop timeouts
            - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
            - REDIS_URL=redis://redis:6379
            - AUTH_SECRET=${AUTH_SECRET}
            - ENCRYPTION_SECRET=${ENCRYPTION_SECRET}
            - OAUTH_PROVIDER_NAME=${OAUTH_PROVIDER_NAME}
            - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
            - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
            - OAUTH_DISCOVERY_URL=${OAUTH_DISCOVERY_URL}
            - FLAG_DISABLE_SIGNUPS=${FLAG_DISABLE_SIGNUPS}
            - FLAG_DISABLE_EMAIL_AUTH=${FLAG_DISABLE_EMAIL_AUTH}
            - FLAG_DISABLE_IMAGE_PROCESSING=${FLAG_DISABLE_IMAGE_PROCESSING}
            - FLAG_DISABLE_API_RATE_LIMIT=${FLAG_DISABLE_API_RATE_LIMIT}
            # S3 Compatible Block for MEGA S4
            - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
            - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
            - S3_BUCKET=${S3_BUCKET}
            - S3_REGION=${S3_REGION}
            - S3_ENDPOINT=${S3_ENDPOINT}
            - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
        volumes:
            - /docker/ReactiveResume/data:/app/data
        networks:
            - reactive_resume_network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
            interval: 30s
            timeout: 10s
            retries: 3
