services:
    trek:
        image: mauriceboe/trek:latest
        container_name: trek
        restart: unless-stopped

        read_only: true

        security_opt:
            - no-new-privileges:true

        cap_drop:
            - ALL

        cap_add:
            - CHOWN
            - SETUID
            - SETGID

        tmpfs:
            - /tmp:noexec,nosuid,size=64m

        environment:
            NODE_ENV: production
            PORT: "3000"
            TZ: Europe/Zurich
            LOG_LEVEL: info
            ALLOW_INTERNAL_NETWORK: "true"

            ENCRYPTION_KEY: ${ENCRYPTION_KEY}

            APP_URL: https://trek.valdeze.ch
            ALLOWED_ORIGINS: https://trek.valdeze.ch
            FORCE_HTTPS: "true"
            TRUST_PROXY: "1"

            ADMIN_EMAIL: ${ADMIN_EMAIL}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD}

        volumes:
            - /docker/Trek/data:/app/data
            - /docker/Trek/uploads:/app/uploads

        networks:
            - shared-services

        # Pangolin migration: Trek had no Traefik route before (Pangolin
        # pointed straight at this container). Now internal-only via
        # Traefik -- reachable on the LAN or remotely via the split-tunnel
        # VPN. Delete Trek's Pangolin resource in its dashboard if one
        # still exists.
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.trek.rule=Host(`trek.valdeze.ch`)"
            - "traefik.http.routers.trek.entrypoints=websecure"
            - "traefik.http.routers.trek.tls=true"
            - "traefik.http.routers.trek.tls.certresolver=cloudflare"
            - "traefik.http.services.trek.loadbalancer.server.port=3000"

        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

networks:
    shared-services:
        external: true
