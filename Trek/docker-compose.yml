services:
    trek:
        image: mauriceboe/trek:latest
        container_name: trek
        restart: unless-stopped

        read_only: true

        security_opt:
            - no-new-privileges:true

        cap_drop:
            - ALL

        cap_add:
            - CHOWN
            - SETUID
            - SETGID

        tmpfs:
            - /tmp:noexec,nosuid,size=64m

        environment:
            NODE_ENV: production
            PORT: "3000"
            TZ: Europe/Zurich
            LOG_LEVEL: info
            ALLOW_INTERNAL_NETWORK: "true"

            ENCRYPTION_KEY: ${ENCRYPTION_KEY}

            APP_URL: https://trek.external.valdeze.ch
            ALLOWED_ORIGINS: https://trek.external.valdeze.ch
            FORCE_HTTPS: "true"
            TRUST_PROXY: "1"

            ADMIN_EMAIL: ${ADMIN_EMAIL}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD}

        volumes:
            - /docker/Trek/data:/app/data
            - /docker/Trek/uploads:/app/uploads

        networks:
            - shared-services

        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s

networks:
    shared-services:
        external: true
