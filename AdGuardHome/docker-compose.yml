services:
    adguardhome:
        image: adguard/adguardhome:latest
        container_name: adguardhome
        restart: unless-stopped
        volumes:
            # ABSOLUTE paths mapped to the folders you just created
                - ./workdir:/opt/adguardhome/work
                - ./confdir:/opt/adguardhome/conf
        ports:
            # DNS (TCP/UDP)
            - "53:53/tcp"
            - "53:53/udp"
            # AdGuard Home Web UI / Admin
            - "3000:80/tcp"
          # - "3000:3000/tcp"
            # DNS-over-HTTPS is reached externally via Traefik + Pangolin
            # (doh.valdeze.ch, see labels below) -- NOT published on the
            # host. Do not uncomment 443 here, it would collide with
            # Traefik's own host-published 443.
          # - "443:443/tcp"
          # - "443:443/udp"
            # DNS-over-TLS
          # - "853:853/tcp"
          # - "853:853/udp"
            # DNS-over-QUIC
          # - "784:784/udp"
          # - "8853:8853/udp"
            # DNSCrypt
          # - "5443:5443/tcp"
          # - "5443:5443/udp"
        networks:
            - default
            - shared-services
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=shared-services"

            # DNS-over-HTTPS, reached from anywhere via Pangolin -> Traefik.
            # Traefik terminates the public TLS cert (certresolver=cloudflare)
            # and re-encrypts to AdGuard Home's own DoH listener on :443,
            # which only needs to hold *a* cert (self-signed is fine --
            # Traefik's global serversTransport.insecureSkipVerify in
            # config/traefik.yml skips backend cert validation), not a
            # publicly-trusted one.
            - "traefik.http.routers.adguardhome-doh.rule=Host(`doh.valdeze.ch`) && PathPrefix(`/dns-query`)"
            - "traefik.http.routers.adguardhome-doh.entrypoints=websecure"
            - "traefik.http.routers.adguardhome-doh.tls=true"
            - "traefik.http.routers.adguardhome-doh.tls.certresolver=cloudflare"
            - "traefik.http.routers.adguardhome-doh.service=adguardhome-doh"
            - "traefik.http.services.adguardhome-doh.loadbalancer.server.port=443"
            - "traefik.http.services.adguardhome-doh.loadbalancer.server.scheme=https"

networks:
    default: {}
    shared-services:
        external: true
        name: shared-services
