services:
    adguardhome:
        image: adguard/adguardhome:latest
        container_name: adguardhome
        restart: unless-stopped
        volumes:
            # ABSOLUTE paths mapped to the folders you just created
                - ./workdir:/opt/adguardhome/work
                - ./confdir:/opt/adguardhome/conf
        ports:
            # DNS (TCP/UDP)
            - "53:53/tcp"
            - "53:53/udp"
            # AdGuard Home Web UI / Admin
            - "3000:80/tcp"
          # - "3000:3000/tcp"
            # DNS-over-HTTPS
          # - "443:443/tcp"
          # - "443:443/udp"
            # DNS-over-TLS
          # - "853:853/tcp"
          # - "853:853/udp"
            # DNS-over-QUIC
          # - "784:784/udp"
          # - "8853:8853/udp"
            # DNSCrypt
          # - "5443:5443/tcp"
          # - "5443:5443/udp"
