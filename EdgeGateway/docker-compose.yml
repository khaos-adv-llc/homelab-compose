    newt:
        image: fosrl/newt
        container_name: newt
        restart: unless-stopped

        environment:
            PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT}
            NEWT_ID: ${NEWT_ID}
            NEWT_SECRET: ${NEWT_SECRET}
            # Talks to the scoped, read-only socket-proxy in ../SocketProxy
            # instead of mounting the host's real docker.sock.
            DOCKER_SOCKET: tcp://dashboard-socket-proxy:2375

        networks:
            - MediaServer
            - shared-services
            - reactive_resume_network

networks:
    MediaServer:
        external: true
    shared-services:
        external: true
    reactive_resume_network:
        external: true
        name: reactive_resume_network
