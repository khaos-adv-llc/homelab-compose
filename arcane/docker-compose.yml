services:
    arcane:
        image: ghcr.io/getarcaneapp/manager:latest
        container_name: arcane
        hostname: arcane
        restart: unless-stopped

        ports:
            - "3552:3552"
        # Pangolin migration: this used to run a dual internal/external
        # hostname split (arcane.internal.valdeze.ch redirecting to the
        # canonical arcane.external.valdeze.ch, which was reachable via
        # Pangolin). Collapsed to a single internal-only hostname --
        # reachable on the LAN directly, or remotely via the split-tunnel
        # VPN. No Pangolin resource for Arcane anymore; if one still
        # exists in Pangolin's dashboard, delete it there.
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.arcane.rule=Host(`arcane.valdeze.ch`)"
            - "traefik.http.routers.arcane.entrypoints=websecure"
            - "traefik.http.routers.arcane.tls=true"
            - "traefik.http.routers.arcane.tls.certresolver=cloudflare"
            - "traefik.http.routers.arcane.service=arcane"
            - "traefik.http.services.arcane.loadbalancer.server.port=3552"

        environment:
            APP_URL: "https://arcane.valdeze.ch"
            TZ: Europe/Zurich
            PUID: "1000"
            PGID: "1000"

            OIDC_AUTO_REDIRECT_TO_PROVIDER: "true"
            DATABASE_URL: ${ARCANE_DATABASE_URL}
            ENCRYPTION_KEY: ${ARCANE_ENCRYPTION_KEY}
            JWT_SECRET: ${ARCANE_JWT_SECRET}

            PROJECTS_DIRECTORY: /docker

        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /docker:/docker
            - ./data:/app/data
            - ./backups:/backups
            - ./builds:/builds

        networks:
            - shared-services

        cgroup: host

        healthcheck:
            test: ["CMD", "./arcane", "health", "--timeout", "2s"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 30s

networks:
    shared-services:
        external: true
