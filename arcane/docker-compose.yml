services:
    arcane:
        image: ghcr.io/getarcaneapp/manager:latest
        container_name: arcane
        hostname: arcane
        restart: unless-stopped

        ports:
            - "3552:3552"
#        labels:
#            - "traefik.enable=true"
#            - "traefik.http.routers.arcane.rule=Host(`arcane.internal.valdeze.ch`)"
#            - "traefik.http.routers.arcane.entrypoints=websecure"
#            - "traefik.http.routers.arcane.tls=true"
#            - "traefik.http.routers.arcane.tls.certresolver=cloudflare"
#            - "traefik.http.services.arcane.loadbalancer.server.port=3552"
        labels:
            - "traefik.enable=true"

            # Canonical, externally reachable Arcane endpoint.
            - "traefik.http.routers.arcane.rule=Host(`arcane.external.valdeze.ch`)"
            - "traefik.http.routers.arcane.entrypoints=websecure"
            - "traefik.http.routers.arcane.tls=true"
            - "traefik.http.routers.arcane.tls.certresolver=cloudflare"
            - "traefik.http.routers.arcane.service=arcane"
            - "traefik.http.services.arcane.loadbalancer.server.port=3552"

            # Internal hostname: redirect, never serve Arcane directly.
            - "traefik.http.routers.arcane-internal-redirect.rule=Host(`arcane.internal.valdeze.ch`)"
            - "traefik.http.routers.arcane-internal-redirect.entrypoints=websecure"
            - "traefik.http.routers.arcane-internal-redirect.tls=true"
            - "traefik.http.routers.arcane-internal-redirect.tls.certresolver=cloudflare"
            - "traefik.http.routers.arcane-internal-redirect.service=noop@internal"
            - "traefik.http.routers.arcane-internal-redirect.middlewares=arcane-internal-to-external"

            # Preserve the entire URL path, e.g. /settings/users.
            # $$ is required in Docker Compose labels so Traefik receives ${1}.
            - "traefik.http.middlewares.arcane-internal-to-external.redirectregex.regex=^https://arcane\\.internal\\.valdeze\\.ch/(.*)"
            - "traefik.http.middlewares.arcane-internal-to-external.redirectregex.replacement=https://arcane.external.valdeze.ch/$${1}"
            - "traefik.http.middlewares.arcane-internal-to-external.redirectregex.permanent=true"

        environment:
            APP_URL: "https://arcane.external.valdeze.ch"
            TZ: Europe/Zurich
            PUID: "1000"
            PGID: "1000"

            OIDC_AUTO_REDIRECT_TO_PROVIDER: "true"
            DATABASE_URL: ${ARCANE_DATABASE_URL}
            ENCRYPTION_KEY: ${ARCANE_ENCRYPTION_KEY}
            JWT_SECRET: ${ARCANE_JWT_SECRET}

            PROJECTS_DIRECTORY: /docker

        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /docker:/docker
            - ./data:/app/data
            - ./backups:/backups
            - ./builds:/builds

        networks:
            - shared-services

        cgroup: host

        healthcheck:
            test: ["CMD", "./arcane", "health", "--timeout", "2s"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 30s

networks:
    shared-services:
        external: true
