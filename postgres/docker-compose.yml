services:
    postgres:
        image: postgres:17
        container_name: postgres
        hostname: postgres
        restart: unless-stopped

        environment:
            POSTGRES_USER_FILE: /run/secrets/pg_user
            POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw
            POSTGRES_DB: postgres
            POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
            TZ: Europe/Zurich
            PGTZ: Europe/Zurich

        secrets:
            - pg_user
            - pg_pw
            - arcane_pg_pw

        volumes:
            - ./data:/var/lib/postgresql/data
            - ./initdb:/docker-entrypoint-initdb.d:ro

        networks:
            - shared-services

        ports:
            - "127.0.0.1:5432:5432"

        shm_size: 256mb

        command:
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - pg_stat_statements.track=all
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - log_min_duration_statement=1000
            - -c
            - log_line_prefix=%m [%p] %u@%d %r

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/pg_user)\" -d postgres"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

secrets:
    pg_user:
        file: ./secrets/pg_user.txt
    pg_pw:
        file: ./secrets/pg_pw.txt
    arcane_pg_pw:
        file: ./secrets/arcane_pg_pw.txt

networks:
    shared-services:
        external: true
